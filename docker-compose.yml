services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cynelo-backend
    env_file:
      - .env.docker
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cynelo-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped